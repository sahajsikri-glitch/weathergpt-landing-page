<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherGPT-Saas-landing-page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <img
          class="weathergpt-logo"
          src="animation/weatherGPT-logo.jpeg"
          alt="WeatherGPT logo"
        />
        <p>WeatherGPT</p>
      </div>
      <nav class="main-nav">
        <ul>
          <li>
            Product
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="arrow-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m19.5 8.25-7.5 7.5-7.5-7.5"
              />
            </svg>
          </li>
          <li>
            Solution
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="arrow-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m19.5 8.25-7.5 7.5-7.5-7.5"
              />
            </svg>
          </li>
          <li>
            Resources
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="arrow-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m19.5 8.25-7.5 7.5-7.5-7.5"
              />
            </svg>
          </li>
          <li>
            Pricing
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="arrow-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m19.5 8.25-7.5 7.5-7.5-7.5"
              />
            </svg>
          </li>
        </ul>
      </nav>
      <nav class="secondary-nav">
        <ul>
          <li class="btn btn--full">Get Started |</li>
          <li class="btn btn--outline">Log in |</li>
          <li class="btn btn--outline">Sign up</li>
        </ul>
      </nav>
    </header>

    <section class="hero-section">
      <video class="hero-bg" autoplay muted loop playsinline>
        <source src="animation/weather-bg.mp4" type="video/mp4" />
      </video>
      <h1 class="hero-content">
        Don't just check the weather. Make decisions with it
      </h1>
    </section>
  </body>
</html>
